name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `pnpm verify` split into parallel jobs, so that CI takes as long as its slowest part. Together
  # they run every script of `pnpm verify` (a test in apps/server/src/github/skeleton.test.ts).
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # Reads the pnpm version from the packageManager field of package.json.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm docs:links

      - name: Dependency audit (fails on critical vulnerabilities)
        run: pnpm audit --audit-level critical

  # The tests in three shards on three runners (ADR 0032). Vitest gives each shard a third of the
  # test files, by a hash of their paths, not by duration: the slowest files decide the balance.
  # One job id for all shards, so `ci` needs `test` once and fails if any shard failed.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every shard runs to the end, so a failure in one does not hide those of the others.
      fail-fast: false
      matrix:
        # 1 to N, in order: shard i runs `--shard=i/N`, N being the number of shards.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1

      # The integration tests' PostgreSQL, as developers run it: durability turned off for speed
      # (ADR 0031). Started first, so it gets ready during the next steps.
      - name: Test PostgreSQL
        run: docker compose -f docker/compose.dev.yml up --detach postgres-test

      # Reads the pnpm version from the packageManager field of package.json.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The daemon's runner tests use the host's tmux and Git (ADR 0027). tmux comes from apt and
      # cannot be pinned: its version is printed (minimum 3.2, docs/dev/setup.md).
      - name: tmux for the daemon's tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tmux
          tmux -V
          git --version

      # Prints its durability settings (all "off") and where its data is (tmpfs), for the log.
      - name: Wait for the test PostgreSQL
        run: |
          docker compose -f docker/compose.dev.yml up --detach --wait postgres-test
          docker compose -f docker/compose.dev.yml exec -T postgres-test psql -U orchestrator \
            -c "SELECT name, setting FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes')"
          docker compose -f docker/compose.dev.yml exec -T postgres-test df -h /var/lib/postgresql

      - run: pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # Reads the pnpm version from the packageManager field of package.json.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  e2e:
    # End-to-end tests in the same pinned Playwright image as `pnpm test:e2e` (ADR 0021).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      # Keep in step with @playwright/test in apps/web (apps/web/e2e/image-version.test.ts).
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator
          POSTGRES_DB: orchestrator
        options: >-
          --health-cmd "pg_isready -U orchestrator -d orchestrator"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # From the job container, the service is reached by its name.
      TEST_DATABASE_URL: postgres://orchestrator:orchestrator@postgres:5432/orchestrator
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7.0.1

      # The image's Node.js runs pnpm (pinned by packageManager, through Corepack) and the tests.
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-e2e-${{ hashFiles('pnpm-lock.yaml') }}

      - run: corepack pnpm install --frozen-lockfile

      - run: corepack pnpm --filter @orchestrator/web build

      # Same command as tools/e2e-docker.sh runs in the image locally.
      - name: End-to-end tests
        working-directory: apps/web
        run: ./node_modules/.bin/playwright test

      - name: Keep the report of failed tests
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    # Builds the image and starts docker/compose.yml as the owner would.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure the stack
        run: |
          cp .env.example .env
          sed -i "s#^ORCHESTRATOR_SECRET_KEY=.*#ORCHESTRATOR_SECRET_KEY=$(openssl rand -base64 32)#" .env

      - name: Start the stack
        run: docker compose -f docker/compose.yml up --build --detach --wait

      - name: Check health, version and the UI
        run: |
          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:8080/version
          curl --fail --silent --show-error http://localhost:8080/settings/github | grep --quiet '<div id="root">'

      - name: Server logs
        if: always()
        run: docker compose -f docker/compose.yml logs

  # Branch protection requires this job only, by its name: never rename or remove it. List every
  # other job in its needs; it fails when any of them failed, was cancelled or was skipped.
  ci:
    if: always()
    needs: [checks, test, build, e2e, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
