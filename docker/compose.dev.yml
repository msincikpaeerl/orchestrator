# PostgreSQL for development and integration tests (09, section 7.1).
# Start: docker compose -f docker/compose.dev.yml up -d --wait
name: orchestrator-dev

services:
  # Development data (`pnpm dev`).
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      # Local machine only: development credentials.
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orchestrator -d orchestrator]
      interval: 2s
      timeout: 5s
      retries: 30

  # Throw-away databases of the tests only, also used by CI (ADR 0031). Durability is turned off
  # for speed, so its data lives in memory: every start of the container is a clean server, and
  # a stop or restart deletes everything, which is intended. Never use these settings for data to
  # keep, and never in docker/compose.yml.
  postgres-test:
    image: postgres:18.6-alpine3.24
    command: [postgres, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off]
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - 127.0.0.1:5433:5432
    # Replaces the image's data volume.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orchestrator -d orchestrator]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
