# PostgreSQL for development and integration tests (09, section 7.1).
# Start: docker compose -f docker/compose.dev.yml up -d postgres
name: orchestrator-dev

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      # Local machine only: development credentials.
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orchestrator -d orchestrator]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
