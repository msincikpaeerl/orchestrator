# Services of docker/compose.yml, which loads the root .env for the ${...} values.

services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      # ${...} values come from the shell or the root .env (see compose.yml).
      ORCHESTRATOR_SECRET_KEY: ${ORCHESTRATOR_SECRET_KEY:?Set ORCHESTRATOR_SECRET_KEY in .env (see .env.example)}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${PORT:-8080}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Inside the Compose network: the server always listens on 8080 in its container.
      DATABASE_URL: postgres://orchestrator:orchestrator@postgres:5432/orchestrator
      PORT: 8080
    ports:
      # PORT is the port on the host (09, section 7.1).
      - ${PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      # Not published outside the Compose network.
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orchestrator -d orchestrator]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
